[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gujarat-oa-copilot"
version = "1.1.0"
description = "AI-Driven Electricity Market Intelligence & Open Access Bidding Co-Pilot for Gujarat (GERC + IEX DAM/RTM/GDAM + Weather API + Prophet/LSTM/XGBoost Hybrid)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Gujarat OA IEX Co-Pilot Team"}
]
dependencies = [
  "numpy>=1.26.0",
  "pandas>=2.1.0",
  "scikit-learn>=1.4.0",
  "xgboost>=2.0.0",
  "torch>=2.1.0",
  "requests>=2.31.0",
  "matplotlib>=3.8.0",
  "jupyter>=1.0.0",
  "nbformat>=5.9.0",
  "openpyxl>=3.1.0",
]

[project.scripts]
gujarat-oa-copilot = "gujarat_oa_copilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
